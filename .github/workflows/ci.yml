name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Omarchy is Arch: the same Qt (and qmllint) its users have
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python qt6-declarative shellcheck

      - uses: actions/checkout@v5

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Slime-Tasks tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Python compiles
        run: python -m compileall -q plugins bin

      - name: Scripts
        run: |
          bash -n bin/slime-shell bin/slime-tasks bin/clone-omarchy-plugin
          shellcheck -S warning bin/slime-shell bin/slime-tasks bin/clone-omarchy-plugin

      - name: Plugin manifests
        run: |
          for m in plugins/*/manifest.json; do
            python -c "import json,sys,os; m=json.load(open(sys.argv[1])); d=os.path.basename(os.path.dirname(sys.argv[1])); assert m['id']==d and m.get('version') and m.get('kinds'), (d, m)" "$m"
          done

      - name: QML syntax (every file)
        run: |
          # qmlformat parses a file and exits 1 when it can't: a syntax error.
          # It's fast, but it crashes on a few valid files (its own bug); for
          # those, qmllint (slow, so with a time limit) has the last word.
          # Quickshell's imports aren't here, so only syntax errors count.
          fmt=$(command -v qmlformat6 || command -v qmlformat || echo /usr/lib/qt6/bin/qmlformat)
          lint=$(command -v qmllint6 || command -v qmllint || echo /usr/lib/qt6/bin/qmllint)
          bad=0
          while IFS= read -r f; do
            rc=0; out=$("$fmt" "$f" 2>&1 >/dev/null) || rc=$?
            if [ $rc -eq 0 ]; then continue; fi
            if [ $rc -eq 1 ]; then echo "$out"; echo "::error file=$f::QML syntax error"; bad=1; continue; fi
            rc=0; out=$(timeout 90 "$lint" "$f" 2>&1) || rc=$?
            if [ $rc -eq 124 ]; then echo "::warning file=$f::couldn't check (qmlformat crashed, qmllint timed out)"; continue; fi
            if echo "$out" | grep -i -E "syntax error|expected token|unexpected token|unterminated"; then
              echo "::error file=$f::QML syntax error"; bad=1
            fi
          done < <(git ls-files '*.qml')
          exit $bad
