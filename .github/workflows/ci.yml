name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Omarchy is Arch: the same Qt (and qmllint) its users have
    container: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python qt6-declarative shellcheck

      - uses: actions/checkout@v5

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Slime-Tasks tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Python compiles
        run: python -m compileall -q plugins bin

      - name: Scripts
        run: |
          bash -n bin/slime-shell bin/slime-tasks bin/clone-omarchy-plugin
          shellcheck -S warning bin/slime-shell bin/slime-tasks bin/clone-omarchy-plugin

      - name: Plugin manifests
        run: |
          for m in plugins/*/manifest.json; do
            python -c "import json,sys,os; m=json.load(open(sys.argv[1])); d=os.path.basename(os.path.dirname(sys.argv[1])); assert m['id']==d and m.get('version') and m.get('kinds'), (d, m)" "$m"
          done

      - name: QML syntax (every file; Quickshell's imports aren't available here, so only syntax errors fail)
        run: |
          lint=$(command -v qmllint6 || command -v qmllint || ls /usr/lib/qt6/bin/qmllint /usr/lib/qt6/libexec/qmllint 2>/dev/null | head -1 || true)
          [ -n "$lint" ] || { echo "no qmllint"; exit 1; }
          bad=0
          while IFS= read -r f; do
            # qmllint exits non-zero on mere warnings (the imports it can't
            # see): only the syntax errors in its output count
            rc=0; out=$(timeout 30 "$lint" "$f" 2>&1) || rc=$?
            if [ $rc -eq 124 ]; then echo "::warning file=$f::qmllint timed out"; continue; fi
            if echo "$out" | grep -i -E "syntax error|expected token|unexpected token|unterminated"; then
              echo "::error file=$f::QML syntax error"; bad=1
            fi
          done < <(git ls-files '*.qml')
          exit $bad
